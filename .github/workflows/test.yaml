name: Test
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: write

jobs:
  build:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, windows-11-arm, macos-14, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.14t']
        exclude:
          - os: windows-11-arm # -_- 3.14t is currently giving us the middle finger.
            python-version: '3.14t'
          
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        check-latest: true
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
    # I did however need to change how tests works since I am writing a better verison of pycares's tests
    # since I wanted to move to pytest - Vizonex
      run: python -m pip install -r requirements/test.txt
    - name: Build package
      run: python -m pip install .
    
    - name: Run PyTests
      env:
        COLOR: yes
        PIP_USER: 1
      # Run at higher verbosity (This is a newer library after all...)
      run: pytest tests -vv
      shell: bash
      
  # Allow dependabot to run a after all tests have passed through.
  # This will enable lazy merging.
  dependabot:
    needs: [build]
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
